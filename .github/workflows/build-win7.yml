name: Build Windows 7

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（写入 binary 和 Release tag，例如 1.14.0-reF1nd.1）"
        required: true
        type: string
      source_ref:
        description: "sing-box 源码的 git tag（例如 v1.14.0-reF1nd.1）"
        required: true
        default: "testing"
        type: string
      create_release:
        description: "构建完成后自动发布 GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare-go-win7:
    name: Prepare Go toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box source (for setup script)
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Cache Win7 Go toolchain
        id: cache-go-win7
        uses: actions/cache@v4
        with:
          path: ~/go/go_win7
          key: go_win7_1267_v1

      - name: Setup Go for Windows 7
        if: steps.cache-go-win7.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x .github/setup_go_for_windows7.sh
          bash .github/setup_go_for_windows7.sh

      - name: Verify toolchain
        run: |
          set -euo pipefail
          "$HOME/go/go_win7/bin/go" version
          test -d "$HOME/go/go_win7/src" || (echo "src missing" && exit 1)

      - name: Package toolchain
        run: |
          set -euo pipefail
          mkdir -p staging
          tar -czf staging/go_win7.tar.gz -C "$HOME/go" go_win7
          ls -lh staging/go_win7.tar.gz

      - name: Upload toolchain
        uses: actions/upload-artifact@v4
        with:
          name: go-win7-toolchain
          path: staging/go_win7.tar.gz
          retention-days: 1

  build-win7:
    name: Build ${{ matrix.label }}
    needs: prepare-go-win7
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, label: windows-7-amd64 }
          - { goarch: "386", label: windows-7-386 }
    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: reF1nd/sing-box
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Download toolchain
        uses: actions/download-artifact@v4
        with:
          name: go-win7-toolchain

      - name: Extract toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/go"
          tar -xzf go_win7.tar.gz -C "$HOME/go"
          "$HOME/go/go_win7/bin/go" version

      - name: Show build tags
        run: |
          echo "BUILD_TAGS_OTHERS:"
          cat release/DEFAULT_BUILD_TAGS_OTHERS
          echo "---"
          echo "LDFLAGS:"
          cat release/LDFLAGS

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          export GOROOT="$HOME/go/go_win7"
          export PATH="$GOROOT/bin:$PATH"
          export GOOS=windows
          export CGO_ENABLED=0

          BUILD_TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"

          mkdir -p dist
          go build -v -trimpath \
            -o "dist/sing-box.exe" \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ inputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

          ls -la dist/
          file dist/sing-box.exe || true

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          zip "sing-box-${{ inputs.version }}-${{ matrix.label }}.zip" sing-box.exe
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.label }}
          path: dist/sing-box-*.zip
          retention-days: 7

  release:
    name: Publish release
    needs: build-win7
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-win7
          name: "sing-box ${{ inputs.version }} (Windows 7)"
          body: |
            面向 Windows 7 的 sing-box 构建（amd64 / 386）。

            - 源码：reF1nd/sing-box @ ${{ inputs.source_ref }}
            - Go 工具链：打过 Win7 兼容补丁的 Go 1.26.7
          files: dist/*.zip
          fail_on_unmatched_files: true
